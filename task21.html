<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task21</title>
</head>
<body>
    <h1>Student Admission Portal</h1>
    <fieldset>
        <legend>Personal Information</legend>
        <label for="name">Full Name : </label>
        <input type="text" id="name" name="name" placeholder="enter your full name" required><br><br>
        <label for="dob">DOB : </label>
        <input type="Date of Birth" id="dob" name="dob" placeholder ="enter your DOB" required><br><br>
        <label for="gender">Gender : </label>
        <input type="radio" id="gender" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="gender" name="gender" value="female">
        <label for="female">Female</label><br><br>
        <label for="mobile">Mobile : </label>
        <input type="number" id="mobile" name="mobile" placeholder="enter your number" required><br><br>
        <label for="email">Email : </label>
        <input type="email" id="email" name="email" placeholder = "enter your email" required><br><br>
    </fieldset>
    <fieldset>
        <legend>Academic Information</legend>
        <label for="school">School Name : </label>
        <input type="text" id="school" name="school" placeholder ="enter your school name"required><br><br>
        <label for="percentage">Percentage : </label>
        <input type="number" id="percentage" name="percentage" placeholder="enter your percentage" required><br><br>
        <label for="department">Department : </label>
        <select>
            <option value="B.A.TAMIL">B.A.TAMIL</option>
            <option value="B.A.TAMIL">B.A.ENGLISH</option>
            <option value="B.A.TAMIL">B.SC.COMPUTER SCIENCE</option>
            <option value="B.A.TAMIL">B.SC.PHYSICS</option>
        </select>
    </fieldset>
    <label for="file upload">File Upload : </label>
    <input type ="file" id="file upload" name="file upload"><br><br>
    <input type="checkbox" id="checkbox" name="checkbox">
    <label for="checkbox">I acknowledge the above instructions are correct</label>
    <button type="submit">submit</button>
</body>
</html>
