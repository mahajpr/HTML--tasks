<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Event Registration Form</h1>
    <label for="name">Full Name : </label>
    <input type="text" id="name" placeholder = "enter your full name" required><br>
    <label for ="email">Email : </label>
    <input type="email" id="email" placeholder = "enter your email" required><br>
    <label for="number">Phone Number :</label>
    <input type="text" id="number" placeholder="enter your number" required><br>
    <label for ="type">Event type : </label>
    <select name="type" id="type">
        <option value="coding" >coding</option>
        <option value="paper presentations">paper presentations</option>
        <option value="debugging">debugging</option>
    </select><br>
    <label for ="attendance">Attendance : </label>
    <input type="checkbox" id="offline" value="offline">
    <label for="offline">Offline</label>
    <input type="checkbox" id="online" value="online">
    <label for="online">Online</label><br>
    <button type="submit">Submit</button>
</body>
</html>
