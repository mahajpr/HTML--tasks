<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Online Shopping Checkout Form</h1>
    <form action ="/submit-form" method="POST">
        <h3>Customer Details</h3>
        <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required placeholder="John Doe"><br><br>
        <label for="address">Address</label>
            <input type="text" id="address" name="address" required placeholder="123 Main St, Apt 4B"><br><br>
        <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" required placeholder="+91 98765 43210">
        <h3>Order Summary</h3>
            <table border="2">
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Quantity</th>
                        <th>Price</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Wireless Mouse</td>
                        <td>1</td>
                        <td>$25.00</td>
                        <td>$25.00</td>
                    </tr>
                    <tr>
                        <td>Mechanical Keyboard</td>
                        <td>1</td>
                        <td>$75.00</td>
                        <td>$75.00</td>
                    </tr>
                    <tr>
                        <td colspan="3">Total:</td>
                        <td>$100.00</td>
                    </tr>
                </tbody>
            </table>
        <h3>Payment Information</h3>
        <label for="card-number">Card Number : </label>
            <input type="text" id="card-number" name="card-number" required placeholder="XXXX XXXX XXXX XXXX"><br><br>
        <label for="expiry">Expiry Date (MM/YY) : </label>
            <input type="text" id="expiry" name="expiry" required placeholder="MM/YY"><br><br>
        <label for="cvv">CVV : </label>
            <input type="text" id="cvv" name="cvv" required placeholder="XXX"><br><br>

        <button type="submit">Place Order</button>
    </form>
</body>
</html>
